packages:
  - "apps/*"
  - "apps/copacker/scheduler"
  - "packages/*"
nodeLinker: hoisted
verifyDepsBeforeRun: error
catalog:
  "@types/node": 24.19.2
  typescript: 7.0.2
# react-is must match React: recharts reads element types through it, and an older copy hoisted from
# pretty-format does not recognise React 19 elements.
overrides:
  react: 19.2.7
  react-dom: 19.2.7
  react-is: 19.2.7
  # Copacker uses nuqs' TanStack adapter. Do not attach the optional Next peer from the email preview tools.
  "nuqs>next": "-"
# @workos/authkit-session (0.7.1 and the latest 0.8.0) declares @workos-inc/node ^8-^10. Node SDK 11's only breaking
# change is in Pipes, which the session toolkit does not use. Drop this once authkit-session lists ^11.
peerDependencyRules:
  allowedVersions:
    "@workos/authkit-session>@workos-inc/node": "11"
allowBuilds:
  workerd: true
  esbuild: true
  lefthook: true
  sharp: true
  unrs-resolver: true
  "@swc/core": true
  "@parcel/watcher": false
  msw: false
  # Its install script only asks for donations.
  tesseract.js: false
minimumReleaseAgeExclude:
  - "@tanstack/react-start-rsc@0.1.63"
  - "@tanstack/react-start-server@1.167.50"
  - "@tanstack/react-start@1.169.2"
  - "@tanstack/router-generator@1.167.44"
  - "@tanstack/router-plugin@1.168.46"
  - "@tanstack/router-utils@1.162.4"
  - "@tanstack/start-plugin-core@1.171.53"
  - "@tanstack/start-server-core@1.169.43"
  - cf@1.0.0-beta.17
  - "@buildkitgg/dev-domains@0.1.0"
  - "@cloudflare/vite-plugin@2.0.0-beta.v.0"
  - "@turbo/darwin-64@2.11.9"
  - "@turbo/darwin-arm64@2.11.9"
  - "@turbo/linux-64@2.11.9"
  - "@turbo/linux-arm64@2.11.9"
  - "@turbo/windows-64@2.11.9"
  - "@turbo/windows-arm64@2.11.9"
  - turbo@2.11.9
  - "@buildkitgg/shadcn-sync@0.1.4"
