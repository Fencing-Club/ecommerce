packages:
  - "apps/*"
  - "apps/copacker/scheduler"
  - "packages/*"
nodeLinker: hoisted
verifyDepsBeforeRun: error
catalog:
  "@types/node": 24.13.2
  typescript: 7.0.1-rc
# react-is must match React: recharts reads element types through it, and an older copy hoisted from
# pretty-format does not recognise React 19 elements.
overrides:
  react: 19.2.7
  react-dom: 19.2.7
  react-is: 19.2.7
allowBuilds:
  esbuild: true
  lefthook: true
  sharp: true
  workerd: true
  unrs-resolver: true
  "@swc/core": true
  "@parcel/watcher": false
  msw: false
minimumReleaseAgeExclude:
  - "@buildkitgg/dev-domains@0.1.0"
  - "@cloudflare/vite-plugin@2.0.0-beta.v.0"
