packages:
  - "apps/*"
  - "packages/*"
nodeLinker: hoisted
verifyDepsBeforeRun: error
catalog:
  "@types/node": 24.13.2
  typescript: 7.0.1-rc
# react-is must match React: recharts reads element types through it, and an older copy hoisted from
# pretty-format does not recognise React 19 elements.
overrides:
  react: 19.2.7
  react-dom: 19.2.7
  react-is: 19.2.7
  # Copacker uses nuqs' TanStack adapter. Do not attach the optional Next peer from the email preview tools.
  "nuqs>next": "-"
allowBuilds:
  workerd: true
  esbuild: true
  lefthook: true
  sharp: true
  unrs-resolver: true
  "@swc/core": true
  "@parcel/watcher": false
  msw: false
minimumReleaseAgeExclude:
  - "@tanstack/react-start-rsc@0.1.63"
  - "@tanstack/react-start-server@1.167.50"
  - "@tanstack/react-start@1.169.2"
  - "@tanstack/router-generator@1.167.44"
  - "@tanstack/router-plugin@1.168.46"
  - "@tanstack/router-utils@1.162.4"
  - "@tanstack/start-plugin-core@1.171.53"
  - "@tanstack/start-server-core@1.169.43"
  - cf@1.0.0-beta.17
