name: Deploy shared preview assets
on:
  push:
    branches: [main]
    paths:
      - apps/copacker/preview-assets/**
      - apps/copacker/scripts/preview-config.ts
      - pnpm-lock.yaml
      - .github/workflows/preview-assets.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: copacker-preview-assets
  cancel-in-progress: false
jobs:
  deploy:
    if: vars.CLOUDFLARE_PREVIEW_CONFIG != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PNPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_TOKEN }}
      PREVIEW_CONFIG: ${{ vars.CLOUDFLARE_PREVIEW_CONFIG }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm install --global pnpm@12.10.1
      - run: pnpm install --frozen-lockfile
      - run: echo "CLOUDFLARE_ACCOUNT_ID=$(echo "$PREVIEW_CONFIG" | jq -er .accountId)" >> "$GITHUB_ENV"
      - run: pnpm --filter copacker check:types
      - run: pnpm --filter copacker exec vitest run tests/preview-assets.test.ts
      - run: pnpm --filter copacker preview:assets:deploy --dry-run
      - run: pnpm --filter copacker preview:assets:deploy
