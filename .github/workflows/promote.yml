name: Promote to production
# The manually approved release uses the exact commit staging reports after CI and browser qualification.
on:
  workflow_dispatch:
concurrency:
  group: promote-production
  cancel-in-progress: false
jobs:
  staging:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.staging.outputs.sha }}
    steps:
      - name: Find the commit staging serves
        id: staging
        run: |
          sha=$(curl -fsS --max-time 20 "$STAGING_URL/api/health" | jq -r '.commit // empty')
          if ! [[ "$sha" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::Staging does not report a release commit"
            exit 1
          fi
          runs=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$sha" -f branch=main -f status=success --jq '.workflow_runs[].id')
          qualified=false
          for run in $runs; do
            if gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs" \
              --jq '.jobs[] | select((.name | startswith("deploy-staging /")) and .conclusion == "success") | .id' | grep -q .; then
              qualified=true
              break
            fi
          done
          if [ "$qualified" != true ]; then
            echo "::error::The staging commit has no successful CI run with a completed staging deployment."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_URL: ${{ vars.STAGING_URL }}
  promote:
    needs: staging
    uses: ./.github/workflows/release.yml
    with:
      mode: production
      commit: ${{ needs.staging.outputs.sha }}
    secrets: inherit
