name: Terraform operations
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        required: true
        description: Target environment
      operation:
        type: choice
        options: [plan, apply, backup]
        required: true
        description: Plan first; apply only a reviewed, saved plan
      plan_run_id:
        type: string
        description: Required for apply; planning workflow run ID
      plan_attempt:
        type: string
        default: "1"
        description: Required for apply; planning run attempt
      plan_sha256:
        type: string
        description: Required for apply; exact SHA-256 from the reviewed plan
  schedule:
    - cron: "37 */6 * * *"
permissions:
  contents: read
jobs:
  operate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: infrastructure
    strategy:
      fail-fast: false
      matrix:
        environment:
          ${{ fromJSON(github.event_name == 'schedule' && '["staging","production"]' || format('["{0}"]',
          inputs.environment)) }}
    concurrency:
      group: copacker-terraform-${{ matrix.environment }}
      cancel-in-progress: false
    env:
      PNPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_STATE_CREDENTIALS: ${{ secrets.TF_STATE_CREDENTIALS }}
      TF_ENVIRONMENT: ${{ matrix.environment }}
      TF_PLAN_RUN_ID: ${{ inputs.plan_run_id }}
      TF_PLAN_ATTEMPT: ${{ inputs.plan_attempt }}
      TF_PLAN_SHA256: ${{ inputs.plan_sha256 }}
      TF_OPERATION: ${{ inputs.operation || 'backup' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm install --global pnpm@12.10.1
      - run: pnpm install --frozen-lockfile
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - name: Back up, plan or apply the reviewed plan
        working-directory: apps/copacker
        run: pnpm infra:operate "$TF_OPERATION"
