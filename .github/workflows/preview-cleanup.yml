name: Remove Copacker preview
on:
  # Only trusted base-branch code runs with credentials. Never check out a PR head here.
  pull_request_target:
    types: [closed]
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      number:
        description: PR number whose preview should be removed
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: copacker-previews
  cancel-in-progress: false
jobs:
  remove:
    if: >-
      github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PNPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.number }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      NEON_STAGING_BRANCH_ID: ${{ vars.NEON_STAGING_BRANCH_ID }}
      NEON_DATABASE_NAME: ${{ vars.NEON_DATABASE_NAME }}
      NEON_ROLE_NAME: ${{ vars.NEON_ROLE_NAME }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm install --global pnpm@12.10.1
      - run: pnpm install --frozen-lockfile
      - if: github.event_name != 'schedule'
        run: pnpm --filter copacker preview:remove
      - if: github.event_name == 'schedule'
        run: pnpm --filter copacker preview:sweep
