name: Terraform
on:
  pull_request:
    paths: ["apps/copacker/infra/**", "apps/copacker/scripts/terraform-*.ts", ".github/workflows/terraform*.yml"]
  push:
    branches: [main]
    paths: ["apps/copacker/infra/**", "apps/copacker/scripts/terraform-*.ts", ".github/workflows/terraform*.yml"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      matrix:
        environment: [staging, production]
    defaults:
      run:
        working-directory: apps/copacker/infra/${{ matrix.environment }}
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - run: terraform fmt -check -recursive ..
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform validate
