name: Terraform
on:
  pull_request:
    paths: ["apps/copacker/infra/**", "apps/copacker/scripts/terraform-*.ts", ".github/workflows/terraform*.yml"]
  push:
    branches: [main]
    paths: ["apps/copacker/infra/**", "apps/copacker/scripts/terraform-*.ts", ".github/workflows/terraform*.yml"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [staging, production]
    defaults:
      run:
        working-directory: apps/copacker/infra/${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - run: terraform fmt -check -recursive ..
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform validate
