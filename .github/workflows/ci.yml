name: CI
on:
  push:
    branches: [codex/copacker]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  # A newer push replaces a pull request's run, but never cuts off a deploy halfway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  PNPM_CONFIG_REGISTRY: https://registry.npmjs.org/
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: copacker_test
          POSTGRES_DB: copacker_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:copacker_test@localhost:5432/copacker_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # pnpm's version comes from packageManager; setup-node then caches its store.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # Turbo replays lint, types and tests for the packages a push didn't change.
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      # Only Copacker is deployed; the Docker build on Railway builds it again, so this is the pull request's check.
      - run: pnpm turbo run build --filter=copacker
      # Every migration applies to an empty Postgres 18, as it will on staging and production.
      - run: |
          psql "$TEST_DATABASE_URL" -c "CREATE DATABASE copacker_migrate"
          pnpm --filter copacker db:migrate
        env:
          DATABASE_URL: postgresql://postgres:copacker_test@localhost:5432/copacker_migrate

  deploy-staging:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_STAGING_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global @railway/cli
      - run: bash .github/scripts/deploy.sh "$GITHUB_SHA" "${{ vars.STAGING_URL }}"
