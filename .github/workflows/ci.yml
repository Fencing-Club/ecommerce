name: CI
on:
  push:
    branches: [main]
  pull_request:
# Replace superseded checks at job level. Never cancel an active preview mutation just because another push arrives.
env:
  PNPM_CONFIG_REGISTRY: https://registry.npmjs.org/
  # Turbo replays any task whose inputs haven't changed from the shared cache on Cloudflare (apps/turbo-cache).
  TURBO_API: https://turbo.copacker.ai
  TURBO_TEAM: ecommerce
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
jobs:
  # Which apps this change affects (.github/scripts/affected.mjs), so a change to one app, a package it doesn't use or
  # the docs skips another app's tests and deploy. A pull request is compared with its target branch; a push to main
  # with the commit staging serves, so a change an earlier failed run didn't deploy still counts.
  changes:
    runs-on: ubuntu-latest
    outputs:
      copacker: ${{ steps.affected.outputs.copacker }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: base
        run: |
          if [ "$EVENT" = pull_request ]; then
            echo "sha=origin/$BASE_REF" >> "$GITHUB_OUTPUT"
          else
            deployed=$(curl -fsS --max-time 20 "$STAGING_URL/api/health" | jq -r ".commit // empty" || true)
            echo "sha=${deployed:-$BEFORE}" >> "$GITHUB_OUTPUT"
          fi
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          STAGING_URL: ${{ vars.STAGING_URL }}
      - id: affected
        run: node .github/scripts/affected.mjs "${{ steps.base.outputs.sha }}" "$GITHUB_SHA"

  # pnpm verify, split across machines: these checks, Copacker's unit tests (unit), its Worker (worker) and its stories
  # (stories) run side by side.
  verify:
    needs: changes
    concurrency:
      group: verify-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # The pnpm store has its own cache step below, and pnpm isn't installed yet.
          package-manager-cache: false
      # Bootstrap the pinned pnpm release from the public registry.
      - run: npm install --global pnpm@12.10.1
      - run: echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:format
      - run: pnpm check:lint
      - run: pnpm check:types
      - run: pnpm check:unused
      - run: pnpm turbo run test:coverage --filter=!copacker

  # Copacker's unit tests took seven minutes on one machine, so they're split across three. Each shard keeps its results
  # and coverage as a blob, and unit-coverage merges them into one report.
  unit:
    needs: changes
    concurrency:
      group: unit-${{ github.event.pull_request.number || github.run_id }}-${{ matrix.shard }}
      cancel-in-progress: true
    if: needs.changes.outputs.copacker == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm install --global pnpm@12.10.1
      - run: echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run:
          pnpm --filter copacker exec vitest run --project unit --coverage --reporter=blob --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          # One name per shard, so a rerun shard replaces its own blob and the merge still sees all three.
          name: unit-blob-${{ matrix.shard }}
          path: apps/copacker/.vitest/blob
          overwrite: true
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # The unit shards' results and coverage as one report.
  unit-coverage:
    needs: [changes, unit]
    if: ${{ !cancelled() && needs.changes.outputs.copacker == 'true' }}
    concurrency:
      group: unit-coverage-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm install --global pnpm@12.10.1
      - run: echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          pattern: unit-blob-*
          path: apps/copacker/.vitest/blob
          merge-multiple: true
      - run: pnpm --filter copacker exec vitest run --project unit --merge-reports --coverage

  # The built Worker against a real Postgres, and every migration applied to an empty one.
  worker:
    needs: changes
    concurrency:
      group: worker-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    if: needs.changes.outputs.copacker == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: copacker_test
          POSTGRES_DB: copacker_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:copacker_test@localhost:5432/copacker_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm install --global pnpm@12.10.1
      - run: echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      # Build the Worker artifact for pull requests; releases rebuild with their environment configuration.
      - run: pnpm turbo run build --filter=copacker
      - run: pnpm --filter copacker test:worker-webhooks
      - run: pnpm --filter copacker test:worker-jobs
      # Every migration applies to an empty Postgres 18, as it will on staging and production.
      - run: |
          psql "$TEST_DATABASE_URL" -c "CREATE DATABASE copacker_migrate"
          pnpm --filter copacker db:migrate
        env:
          DATABASE_URL: postgresql://postgres:copacker_test@localhost:5432/copacker_migrate

  # Every story renders in Chromium and runs its play function. Run one after another they took 20 minutes, so they're
  # split across four machines.
  stories:
    needs: changes
    concurrency:
      group: stories-${{ github.event.pull_request.number || github.run_id }}-${{ matrix.shard }}
      cancel-in-progress: true
    if: needs.changes.outputs.copacker == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm install --global pnpm@12.10.1
      - run: echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      # Playwright's browsers, kept per Playwright version; the install then only adds the system packages.
      - id: playwright
        run: echo "version=$(pnpm --filter copacker exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-headless-shell
      - run: pnpm --filter copacker exec playwright install --with-deps chromium-headless-shell
      - run: pnpm --filter copacker exec vitest run --project 'storybook*' --shard=${{ matrix.shard }}/4

  # The Playwright suite (apps/copacker/e2e) against a production build, with the E2E seed in a fresh Postgres and the
  # local R2 emulator for uploads. It signs in through the WorkOS environment staging uses. See apps/copacker/docs/e2e.md.
  e2e:
    needs: changes
    concurrency:
      group: e2e-${{ github.event.pull_request.number || github.run_id }}-${{ matrix.shard }}
      cancel-in-progress: true
    if: needs.changes.outputs.copacker == 'true'
    runs-on: ubuntu-latest
    # Split in three, each with its own Worker build, database and R2 emulator. In two, the slower shard took nine minutes.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: copacker_e2e
          POSTGRES_DB: copacker_e2e
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      APP_URL: http://127.0.0.1:3005
      WORKOS_REDIRECT_URI: http://127.0.0.1:3005/callback
      DATABASE_URL: postgresql://postgres:copacker_e2e@localhost:5432/copacker_e2e
      # WorkOS's client ID is public; the API key is the repository secret.
      WORKOS_CLIENT_ID: client_01M4WPTK4JK0HKFZA7ZSMQBVYD
      WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
    steps:
      - name: Check the WorkOS secret
        run: |
          if [ -z "$WORKOS_API_KEY" ]; then
            echo "::error::Add the WORKOS_API_KEY repository secret (the WorkOS staging environment's API key)"
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm install --global pnpm@12.10.1
      - run: echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      # Secrets the app needs that only have to be consistent within this run.
      - run: |
          echo "WORKOS_COOKIE_PASSWORD=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "TOKEN_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      # Local Workers output is environment-specific and never restored from a staging build.
      - run: pnpm --filter copacker exec vite build --mode e2e
      - run: pnpm --filter copacker db:migrate
      - run: pnpm --filter copacker db:seed:e2e
      # Playwright's browsers, kept per Playwright version; the install then only adds the system packages.
      - id: playwright
        run: echo "version=$(pnpm --filter copacker exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - run: pnpm --filter copacker exec playwright install --with-deps chromium
      - run: pnpm --filter copacker test:e2e --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            apps/copacker/e2e/.report
            apps/copacker/e2e/.results
          retention-days: 14
          # The report folders start with a dot, which upload-artifact skips unless told otherwise.
          include-hidden-files: true

  # One fixture build per source commit, shared by verification and preview publication.
  storybook-build:
    needs: changes
    if: needs.changes.outputs.copacker == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: storybook-build-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    outputs:
      artifact: storybook-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
    env:
      APP_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.APP_COMMIT_SHA }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm install --global pnpm@12.10.1
      - run: echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build-storybook --filter=copacker
      - run: pnpm --filter copacker storybook:seal
      - uses: actions/upload-artifact@v7
        with:
          name: storybook-${{ env.APP_COMMIT_SHA }}-${{ github.run_attempt }}
          path: |
            apps/copacker/storybook-static
            apps/copacker/.cloudflare/storybook-artifact.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  preview:
    needs: [changes, storybook-build]
    if: >-
      github.event_name == 'pull_request' && needs.changes.outputs.copacker == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    concurrency:
      group: copacker-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false
      queue: max
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      NEON_STAGING_BRANCH_ID: ${{ vars.NEON_STAGING_BRANCH_ID }}
      NEON_DATABASE_NAME: ${{ vars.NEON_DATABASE_NAME }}
      NEON_ROLE_NAME: ${{ vars.NEON_ROLE_NAME }}
      CLOUDFLARE_PREVIEW_CONFIG: ${{ vars.CLOUDFLARE_PREVIEW_CONFIG }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_TOKEN }}
      CLOUDFLARE_PREVIEW_SECRETS: ${{ secrets.CLOUDFLARE_PREVIEW_SECRETS }}
      APP_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
      PREVIEW_TIMINGS_FILE: .cloudflare/preview-timings.json
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm install --global pnpm@12.10.1
      - run: echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.storybook-build.outputs.artifact }}
          path: apps/copacker
      - id: deploy
        run: pnpm --filter copacker preview:deploy
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: preview-timings-${{ github.run_attempt }}
          path: apps/copacker/.cloudflare/preview-timings.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30

  deploy-staging:
    needs: [changes, verify, unit, unit-coverage, worker, stories, e2e, storybook-build]
    if:
      github.event_name == 'push' && needs.changes.outputs.copacker == 'true' && vars.CLOUDFLARE_RELEASE_ENABLED ==
      'true'
    uses: ./.github/workflows/release.yml
    with:
      mode: staging
      commit: ${{ github.sha }}
    secrets: inherit

  # One check for the whole run, passed when nothing failed or was cancelled; a job skipped because the change didn't
  # affect it counts as passed. It's the check to require in branch protection.
  ci-ok:
    if: always()
    needs: [changes, verify, unit, unit-coverage, worker, stories, e2e, storybook-build, preview, deploy-staging]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -qE "failure|cancelled"; then exit 1; fi
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
