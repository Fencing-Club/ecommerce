name: CI
on:
  push:
    branches: [codex/copacker]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  # A newer push replaces a pull request's run, but never cuts off a deploy halfway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  PNPM_CONFIG_REGISTRY: https://registry.npmjs.org/
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: copacker_test
          POSTGRES_DB: copacker_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:copacker_test@localhost:5432/copacker_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # npm, not pnpm/action-setup: that reads .npmrc's private registry, which CI can't sign in to.
      - run: npm install --global pnpm@11.9.0
      - run: echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      # Turbo replays lint, types and tests for the packages a push didn't change.
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      # Storybook's play functions run in Chromium through Vitest.
      - run: pnpm --filter copacker exec playwright install --with-deps chromium-headless-shell
      - run: pnpm verify
      # Only Copacker is deployed; the Docker build on Railway builds it again, so this is the pull request's check.
      - run: pnpm turbo run build --filter=copacker
      # Every migration applies to an empty Postgres 18, as it will on staging and production.
      - run: |
          psql "$TEST_DATABASE_URL" -c "CREATE DATABASE copacker_migrate"
          pnpm --filter copacker db:migrate
        env:
          DATABASE_URL: postgresql://postgres:copacker_test@localhost:5432/copacker_migrate

  # The Playwright suite (apps/copacker/e2e) against a production build, with the E2E seed in a fresh Postgres and an
  # S3 mock for uploads. It signs in through the WorkOS environment staging uses. See docs/e2e.md.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: copacker_e2e
          POSTGRES_DB: copacker_e2e
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      s3:
        image: adobe/s3mock:5.2.3
        env:
          COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: copacker-e2e
        ports: ["9090:9090"]
    env:
      APP_URL: http://127.0.0.1:3005
      NEXT_PUBLIC_WORKOS_REDIRECT_URI: http://127.0.0.1:3005/callback
      DATABASE_URL: postgresql://postgres:copacker_e2e@localhost:5432/copacker_e2e
      # WorkOS's client ID is public; the API key is the repository secret.
      WORKOS_CLIENT_ID: client_01M3BJHM6XAWTG9WKHNBZGG8AV
      WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
      S3_ENDPOINT: http://127.0.0.1:9090
      S3_BUCKET: copacker-e2e
      S3_ACCESS_KEY_ID: e2e
      S3_SECRET_ACCESS_KEY: e2e
    steps:
      - name: Check the WorkOS secret
        run: |
          if [ -z "$WORKOS_API_KEY" ]; then
            echo "::error::Add the WORKOS_API_KEY repository secret (the WorkOS staging environment's API key)"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --global pnpm@11.9.0
      - run: echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      # Secrets the app needs that only have to be consistent within this run.
      - run: |
          echo "WORKOS_COOKIE_PASSWORD=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "TOKEN_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - run: pnpm --filter copacker build
      - run: pnpm --filter copacker db:migrate
      - run: pnpm --filter copacker db:seed:e2e
      - run: pnpm --filter copacker exec playwright install --with-deps chromium
      - run: pnpm --filter copacker test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/copacker/e2e/.report
            apps/copacker/e2e/.results
          retention-days: 14
          # The report folders start with a dot, which upload-artifact skips unless told otherwise.
          include-hidden-files: true

  deploy-staging:
    needs: [verify, e2e]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_STAGING_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --global @railway/cli
      # The web service's pre-deploy step on staging migrates and then runs the E2E seed (pnpm db:seed:e2e).
      - run: bash .github/scripts/deploy.sh "$GITHUB_SHA" "${{ vars.STAGING_URL }}"
      # Then the whole Playwright suite runs against what was just deployed.
      - run: npm install --global pnpm@11.9.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter copacker exec playwright install --with-deps chromium
      - run: pnpm --filter copacker test:e2e
        env:
          E2E_BASE_URL: ${{ vars.STAGING_URL }}
          WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-staging
          path: |
            apps/copacker/e2e/.report
            apps/copacker/e2e/.results
          retention-days: 14
          # The report folders start with a dot, which upload-artifact skips unless told otherwise.
          include-hidden-files: true
