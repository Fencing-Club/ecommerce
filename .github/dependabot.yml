version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # One PR for routine minor/patch bumps to keep noise down.
      dependencies:
        update-types:
          - minor
          - patch
    ignore:
      # 2.0.0 is only published as beta snapshots; wait for the stable release.
      - dependency-name: "@cloudflare/vite-plugin"
        versions: [">=2.0.0-0 <2.0.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
