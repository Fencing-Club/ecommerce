# Lefthook manages Git hooks for this monorepo.
# Docs: https://lefthook.dev
# Hooks are installed automatically via the root "prepare" script (lefthook install).

# The pre-commit tools run through node, not pnpm: lefthook splits {staged_files} into chunks that fit a
# Windows command line, but pnpm's .cmd shim goes through cmd.exe (8191 characters) and fails on large commits.
pre-commit:
  parallel: false
  commands:
    lint:
      glob: "*.{js,jsx,ts,tsx}"
      run: node node_modules/oxlint/bin/oxlint --fix --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    format:
      glob: "*.{js,jsx,ts,tsx,json,css,scss,yaml,yml,md}"
      run: node node_modules/oxfmt/bin/oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

pre-push:
  commands:
    types:
      run: pnpm run check:types
